[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-measurement-api"
version = "0.2.0"
description = "The store query catalog behind FastAPI, for measuring database engines"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",        # driver.py, loadtest.py, and FastAPI's TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

# Install:  pip install -e ".[dev]"     (from lab/api/starter_code/)

[tool.setuptools]
packages = ["app"]
py-modules = ["driver"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
